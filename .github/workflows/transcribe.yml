name: Transcribe

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Liens et/ou fichiers de la Release 'videos', séparés par ; (VIDE = toutes les nouvelles vidéos de la Release, sinon le dernier lot ; tout = toute la Release). ⚠️ YouTube bloque GitHub : pour YouTube, fais Partager → Termux dans l'appli YouTube. Installation unique dans Termux : curl -fsSL https://raw.githubusercontent.com/MaxMcNeil/Video-transcriber/main/termux-setup.sh | bash"
        required: false
        default: ""
      prompteur:
        description: "Texte prompteur face caméra : langue (auto = langue des sources) ou non"
        type: choice
        options: [auto, fr, ar, it, en, non]
        default: auto
      duree_prompteur:
        description: "Longueur du texte prompteur (auto ≈ selon la matière ; court ≈ 3 min, moyen ≈ 6 min, long ≈ 10 min)"
        type: choice
        options: [auto, court, moyen, long]
        default: auto
      ia:
        description: "IA locale qui écrit le prompteur (l'autre sert de secours)"
        type: choice
        options: [qwen3-8b, mistral-nemo-12b]
        default: qwen3-8b
      translate:
        description: "Traduire aussi la transcription complète en (non = pas de traduction)"
        type: choice
        options: [non, fr, it, en, ar]
        default: non
      model:
        description: "Modèle de transcription (auto = large-v3, le plus précis, sur chaque tranche)"
        type: choice
        options: [auto, large-v3, large-v3-turbo, small]
        default: auto

permissions:
  contents: write

jobs:
  # 1) Récupère les sources et les découpe en tranches de ~25 min (coupées sur des silences)
  recuperer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      ids: ${{ steps.plan.outputs.ids }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Installer ffmpeg et le téléchargement
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          pip install -q -U "yt-dlp[default]"

      - name: Installer Deno (requis par yt-dlp pour YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Récupérer les sources
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ inputs.source }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          bash fetch.sh "$SRC"
          rm -f cookies.txt

      - name: Découper en tranches
        id: plan
        run: python transcribe.py --etape plan

      - uses: actions/upload-artifact@v4
        with:
          name: decoupe
          path: |
            work/plan.json
            segments/
            in/sources.tsv
            in/ids_release.txt
            in/echecs.txt
          if-no-files-found: error
          retention-days: 7

  # 2) Chaque tranche sur son propre serveur, avec le modèle le plus précis
  transcrire:
    needs: recuperer
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.recuperer.outputs.ids) }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Cache du modèle de transcription
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--*whisper*
          key: whisper-v2-${{ inputs.model }}

      - uses: actions/download-artifact@v4
        with:
          name: decoupe
          path: .

      - name: Transcrire la tranche ${{ matrix.id }}
        env:
          MODEL: ${{ inputs.model }}
          ID: ${{ matrix.id }}
        run: python transcribe.py --etape segment --id "$ID" --model "$MODEL"

      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.id }}
          path: work/segs/
          retention-days: 7

  # 3) Recolle les tranches, publie la transcription (tout de suite, sans attendre le prompteur)
  assembler:
    needs: [recuperer, transcrire]
    if: always() && needs.recuperer.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer la traduction (si demandée)
        if: inputs.translate != 'non'
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q argostranslate

      - uses: actions/download-artifact@v4
        with:
          name: decoupe
          path: .

      - name: Récupérer les tranches transcrites
        continue-on-error: true        # une tranche manquante est signalée dans le texte
        uses: actions/download-artifact@v4
        with:
          pattern: seg-*
          path: work/segs
          merge-multiple: true

      - name: Assembler
        env:
          TRAD: ${{ inputs.translate }}
        run: |
          mkdir -p work/segs
          echo "Tranches transcrites : $(ls work/segs | wc -l)"
          python transcribe.py --etape assembler --translate "$TRAD"

      - name: Garder le travail pour l'écriture du prompteur
        if: always() && hashFiles('work/meta.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: travail
          path: |
            work/meta.json
            work/source_*.json
            out/
          retention-days: 7

      - name: Publier dans la Release 'transcriptions'
        if: always() && hashFiles('out/*.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view transcriptions >/dev/null 2>&1 || \
            gh release create transcriptions -t "Transcriptions" -n "Transcriptions et textes prompteur"
          shopt -s nullglob
          gh release upload transcriptions out/*.txt out/*.srt --clobber
          # mémorise les vidéos de la Release déjà transcrites (source vide = seulement les nouvelles)
          if [ -s in/ids_release.txt ]; then
            gh release download transcriptions -p "_videos_deja_traitees.txt" -O deja.txt --clobber 2>/dev/null || : > deja.txt
            cat deja.txt in/ids_release.txt | sed '/^$/d' | sort -u > _videos_deja_traitees.txt
            gh release upload transcriptions _videos_deja_traitees.txt --clobber
          fi
          {
            echo "## Transcription (Release **transcriptions**)"
            for f in out/*.txt out/*.srt; do echo "- \`$(basename "$f")\`"; done
            if [ -s in/echecs.txt ]; then
              echo; echo "### ⚠️ Sources non récupérées"
              sed 's/^/- /' in/echecs.txt
            fi
            echo; echo "_Le texte prompteur est écrit ensuite par le job « prompteur »._"
            t=$(ls out/*_transcription.txt 2>/dev/null | head -n1)
            if [ -n "$t" ]; then
              echo; echo "### Début de la transcription"; echo '```'; head -c 1000 "$t"; echo; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 4) Texte prompteur : fiches réparties sur 4 serveurs en parallèle, puis écriture
  prompteur:
    needs: assembler
    if: inputs.prompteur != 'non'
    uses: ./.github/workflows/prompteur-commun.yml
    with:
      langue: ${{ inputs.prompteur }}
      duree: ${{ inputs.duree_prompteur }}
      ia: ${{ inputs.ia }}
    permissions:
      contents: write
