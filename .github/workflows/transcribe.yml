name: Transcribe

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Lien (YouTube, Drive, direct…) OU nom du fichier dans la Release 'videos'. Vide = dernière vidéo déposée"
        required: false
        default: ""
      translate:
        description: "Traduire la transcription en (non = pas de traduction)"
        type: choice
        options: [non, fr, it, en, ar]
        default: non
      model:
        description: "Modèle Whisper (auto = choisi selon la durée)"
        type: choice
        options: [auto, small, medium, large-v3]
        default: auto

permissions:
  contents: write

concurrency:
  group: transcribe-${{ github.run_id }}

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          ffmpeg -version | head -n1

      - name: Installer la transcription et le téléchargement
        run: |
          pip install -q -r requirements.txt
          pip install -q -U "yt-dlp[default]"

      - name: Installer Deno (requis par yt-dlp pour YouTube)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Installer la traduction (si demandée)
        if: inputs.translate != 'non'
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q argostranslate

      - name: Cache des modèles
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/stanza_resources
          key: modeles-v2-${{ github.run_id }}
          restore-keys: modeles-v2-

      - name: Récupérer la vidéo
        env:
          GH_TOKEN: ${{ github.token }}
          SRC: ${{ inputs.source }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > cookies.txt; fi
          bash fetch.sh "$SRC"
          rm -f cookies.txt

      - name: Transcrire
        env:
          MODEL: ${{ inputs.model }}
          TRAD: ${{ inputs.translate }}
        run: python transcribe.py "$FICHIER" --model "$MODEL" --translate "$TRAD" --out out

      # Les étapes suivantes tournent même en cas d'échec ou de coupure,
      # pour récupérer la transcription partielle.
      - name: Artefact
        if: always() && hashFiles('out/*.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: transcription
          path: out/*.*

      - name: Publier dans la Release 'transcriptions'
        if: always() && hashFiles('out/*.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view transcriptions >/dev/null 2>&1 || \
            gh release create transcriptions -t "Transcriptions" -n "Fichiers .txt et .srt"
          gh release upload transcriptions out/*.txt out/*.srt --clobber
          {
            echo "## Transcription"
            echo "Fichiers dans la Release **transcriptions** :"
            for f in out/*.txt out/*.srt; do echo "- $(basename "$f")"; done
            echo
            echo "### Début du texte"
            echo '```'
            head -c 1500 "$(ls out/*.txt | head -n1)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
